<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>AskOra Admin</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: #080B18;
            color: #F5F7FF;
            font-family:
                Inter,
                system-ui,
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                sans-serif;
        }

        .page {
            max-width: 1100px;
            margin: auto;
            padding: 25px;
        }

        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 15px;
            margin-bottom: 30px;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 11px;
        }

        .logo {
            width: 42px;
            height: 42px;
            display: grid;
            place-items: center;
            border-radius: 13px;
            font-weight: 900;
            font-size: 21px;
            background:
                linear-gradient(
                    135deg,
                    #3B82F6,
                    #7C3AED
                );
        }

        .brand strong {
            display: block;
            font-size: 18px;
        }

        .brand small {
            color: #8D96AA;
            font-size: 11px;
        }

        .actions {
            display: flex;
            gap: 8px;
        }

        .button {
            border: 1px solid rgba(255,255,255,.08);
            border-radius: 9px;
            padding: 9px 12px;
            background: #10152B;
            color: #CBD5E1;
        }

        .button:hover {
            background: #171E38;
            color: white;
        }

        h1 {
            margin: 0 0 7px;
            font-size: 28px;
        }

        .description {
            margin: 0 0 25px;
            color: #8D96AA;
        }

        .stats {
            display: grid;
            grid-template-columns:
                repeat(3, minmax(0, 1fr));
            gap: 14px;
        }

        .card {
            padding: 22px;
            border-radius: 16px;
            border: 1px solid rgba(255,255,255,.07);
            background: #10152B;
        }

        .card-label {
            color: #8D96AA;
            font-size: 12px;
        }

        .card-value {
            margin-top: 10px;
            font-size: 30px;
            font-weight: 800;
        }

        .loading {
            color: #8D96AA;
        }

        @media (max-width: 700px) {

            .page {
                padding: 18px;
            }

            .header {
                align-items: flex-start;
                flex-direction: column;
            }

            .stats {
                grid-template-columns: 1fr;
            }

        }

    </style>

</head>

<body>

<div class="page">

    <header class="header">

        <div class="brand">

            <div class="logo">A</div>

            <div>
                <strong>AskOra Admin</strong>
                <small>Dashboard</small>
            </div>

        </div>

        <div class="actions">

            <button
                class="button"
                onclick="window.location.href='/'"
            >
                ← AskOra
            </button>

            <button
                class="button"
                onclick="logout()"
            >
                Log out
            </button>

        </div>

    </header>


    <h1>Dashboard</h1>

    <p class="description">
        Overview of your AskOra website.
    </p>


    <div class="stats">

        <div class="card">
            <div class="card-label">
                Total Users
            </div>

            <div
                class="card-value"
                id="totalUsers"
            >
                <span class="loading">...</span>
            </div>
        </div>


        <div class="card">
            <div class="card-label">
                Active Users Today
            </div>

            <div
                class="card-value"
                id="activeUsers"
            >
                <span class="loading">...</span>
            </div>
        </div>


        <div class="card">
            <div class="card-label">
                Total Chats
            </div>

            <div
                class="card-value"
                id="totalChats"
            >
                <span class="loading">...</span>
            </div>
        </div>


        <div class="card">
            <div class="card-label">
                Total Questions
            </div>

            <div
                class="card-value"
                id="totalQuestions"
            >
                <span class="loading">...</span>
            </div>
        </div>


        <div class="card">
            <div class="card-label">
                Voice Requests
            </div>

            <div
                class="card-value"
                id="voiceRequests"
            >
                <span class="loading">...</span>
            </div>
        </div>


        <div class="card">
            <div class="card-label">
                New Users Today
            </div>

            <div
                class="card-value"
                id="newUsers"
            >
                <span class="loading">...</span>
            </div>
        </div>

    </div>

</div>


<script>

const CSRF =
    {{ (csrf_token or "")|tojson }};


async function loadStats() {

    try {

        const response =
            await fetch(
                "/api/admin/stats"
            );

        const data =
            await response.json();

        if (!data.ok) {

            alert(
                data.error ||
                "Unable to load statistics."
            );

            return;
        }

        document.getElementById(
            "totalUsers"
        ).textContent =
            data.total_users;

        document.getElementById(
            "activeUsers"
        ).textContent =
            data.active_users_today;

        document.getElementById(
            "totalChats"
        ).textContent =
            data.total_chats;

        document.getElementById(
            "totalQuestions"
        ).textContent =
            data.total_questions;

        document.getElementById(
            "voiceRequests"
        ).textContent =
            data.voice_requests;

        document.getElementById(
            "newUsers"
        ).textContent =
            data.new_users_today;

    } catch (error) {

        alert(
            "Could not load admin statistics."
        );
    }
}


async function logout() {

    const response =
        await fetch(
            "/logout",
            {
                method: "POST",
                headers: {
                    "X-CSRF-Token":
                        CSRF
                }
            }
        );

    const data =
        await response.json();

    if (data.ok) {
        window.location.href =
            "/login";
    }
}


loadStats();

</script>

</body>
</html>
